sass:
  sass_dir: _sass
  style: compressed

locale: "en-US"
title: "Alejandro Mahillo"
title_separator: "-"
name: &name "Alejandro Mahillo"
description: &description "Assistant Professor at Universidad de Cantabria. Researcher in C₀-semigroup theory, functional calculus, and operator theory."
url: https://alejandro-mahillo.github.io
baseurl: ""
repository: "alejandro-mahillo.github.io"

og_image: "profile2.jpg"

twitter:
  username: "alejandromahillo"

author:
  avatar: "profile2.jpg"
  name: "Alejandro Mahillo"
  bio: "Assistant Professor"
  location: "Santander, Spain"
  employer: "Universidad de Cantabria"
  email: "alejandro.mahillo@unican.es"
  googlescholar: "https://scholar.google.com/citations?user=TYe68ZsAAAAJ"
  orcid: "https://orcid.org/0000-0003-4189-0268"
  researchgate: "https://www.researchgate.net/profile/Alejandro-Mahillo"
  linkedin: "alejandromahillo"

publication_category:
  manuscripts:
    title: 'Journal Articles'

teaser: ""
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: true

comments:
  provider: false

google_site_verification: "s4qviia5_Nbj4ZIjxvyooXASGBkPQetooY0qSvB9Xwg"

analytics:
  provider: "false"

include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      katex: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
