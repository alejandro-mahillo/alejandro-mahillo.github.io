name: Scrape Talk Locations

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - '_talks/**'
      - 'talkmap.py'
      - '.github/workflows/scrape_talks.yml' # Fixed the filename here to match your uploaded file

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-frontmatter geopy

    - name: Run Talk Map Script
      run: |
        python talkmap.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add talkmap/org-locations.js
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push