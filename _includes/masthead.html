<header class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary">
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item" data-nav-link><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item masthead__theme">
            <button id="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" hidden>
              <i class="fa-solid fa-sun" aria-hidden="true"></i>
            </button>
          </li>
        </ul>
        <button class="nav-toggle" type="button" aria-label="More links" aria-expanded="false" aria-controls="overflow-links" hidden>
          <span class="navicon" aria-hidden="true"></span>
        </button>
        <ul id="overflow-links" class="hidden-links" hidden></ul>
      </nav>
    </div>
  </div>
</header>
